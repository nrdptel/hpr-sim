# The oracle Python environment: `uv sync --frozen` from validation/oracles/uv.lock, which pins
# every package by hash (orhelper by git commit). Selected on the command line as `python`.
[python]
project = "validation/oracles"
venv = "refs/venv"
checks = [
    { module = "rocketpy", version = "1.13.0" },
    { module = "orhelper", version = "0.1.5" },
    { module = "jpype" },
    { module = "mpmath", version = "1.3.0" },
    { module = "ambiance", version = "1.3.1" },
]

# The OpenRocket oracle's runtime. `doctor` looks in JAVA_HOME, /usr/libexec/java_home (macOS),
# Homebrew's openjdk kegs, then PATH.
[java]
min_major = 17
