# The reference library: every outside source the validation work uses, pinned.
#
#   cargo xtask refs fetch     # bring refs/ to the pinned state (idempotent)
#   cargo xtask refs verify    # re-hash everything against these pins
#   cargo xtask refs doctor    # which tools and oracles work on this machine
#
# Everything lands in the gitignored refs/ and is never committed (CLAUDE.md rules 3 and 4).
# Every item needs a row in THIRD-PARTY-NOTICES.md with the same license and mode; a test checks
# that. Modes: `fetched` (downloaded and read or used as data) or `run-only` (executed as an
# oracle; its source is never read). Sources were checked on 2026-09-17.

version = 1

# Git repositories, pinned by full commit id. `shallow` fetches only that commit.

