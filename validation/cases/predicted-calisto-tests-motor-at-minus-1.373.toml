# Calisto: RocketPy's example flown from the pad to the ground, each code with its own drag
# (`validation/oracles/rocketpy/flight.py --own-drag`, M2.1c2).
#
# Predicted mode (ADR-023): hpr flies its own drag, from the design's geometry, where the same-drag
# case flies the declared table (its normal force is its own in both modes, so only the drag
# differs); the reference is RocketPy flying the example's own drag as RocketPy 1.13.0 flies the
# example (RocketPy's `powerOffDragCurve.csv` and `powerOnDragCurve.csv`, which are identical), with
# RocketPy's own normal force. Everything else is the same-drag case's
# (`flight-calisto-tests-motor-at-minus-1.373.toml`): the site, the declared wind, the rail, the
# parachutes, the motor, RocketPy's gravity and atmosphere, and the same checks that hpr's design is
# the rocket the reference flew. So a difference here is the same-drag difference plus the two
# codes' drag, and neither drag is the truth. hpr's is for the design as transcribed: its fin
# thickness and edges and its surface finish are placeholders where RocketPy's example records none
# (`xtask/src/designs.rs`), so a miss is not a gap for hpr to close toward the example's drag.
#
# Every metric carries M2.1's 3% as a target: reported as within or outside it, never gated, so a
# miss does not fail the run and a number that moves still shows in the committed report. Nothing
# misses. The apogee is -0.61%, with hpr's C_D0 4.4% above the example's curve at Mach 0.3
# (`validation/fixtures/aero/rocketpy-drag-curves.json`), and the drifts are -2.23% and +0.90%
# (-0.90% and +1.26% on the same drag, where they are gated). Against RocketPy as released the
# drifts missed by -7.00% and +6.92% (issue #50); the corrected reference (ADR-026) closes them.
id = "predicted-calisto-tests-motor-at-minus-1.373"
title = "Calisto from the pad to the ground, predicted: hpr's own aerodynamics"
reference = "validation/fixtures/flight/rocketpy-whole-flight-own-drag.json"
reference_case = "calisto-tests-motor-at-minus-1.373"

[flight.whole_flight]
design = "rocketpy-calisto-tests-motor-at-minus-1.373"
configuration = "example"
mode = "predicted"

[metrics.apogee_agl_m]
relative = 0.03

[metrics.apogee_time_s]
relative = 0.03

[metrics.max_speed_m_s]
relative = 0.03

[metrics.max_mach]
relative = 0.03

[metrics.max_acceleration_m_s2]
relative = 0.03

[metrics.max_acceleration_time_s]
relative = 0.03

[metrics.max_acceleration_power_on_m_s2]
relative = 0.03

[metrics.rail_exit_speed_m_s]
relative = 0.03

[metrics.rail_exit_time_s]
relative = 0.03

[metrics.burnout_altitude_agl_m]
relative = 0.03

[metrics.burnout_speed_m_s]
relative = 0.03

[metrics.flight_time_s]
relative = 0.03

[metrics.apogee_drift_m]
relative = 0.03

[metrics.landing_drift_m]
relative = 0.03

[metrics.impact_speed_m_s]
relative = 0.03

# The time-series RMS (M2.1d1): hpr's height and speed at the reference's 120 series times, from
# ignition until hpr lands, less RocketPy's; the reference value is 0, exact agreement. Each is held
# (a target) to 3% of the scale of its trace, the reference's apogee (2820.6 m) and max speed
# (247.2 m/s), rounded down to 0.1: M2.1's 3% for a point metric, applied to a whole trace, so a
# trace passes only if it is on average no further off than its peak may be.
[metrics.series_height_rms_m]
absolute = 84.6

[metrics.series_speed_rms_m_s]
absolute = 7.4
