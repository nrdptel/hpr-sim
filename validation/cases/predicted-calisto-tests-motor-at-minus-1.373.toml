# Calisto: RocketPy's example flown from the pad to the ground, each code with its own drag
# (`validation/oracles/rocketpy/flight.py --own-drag`, M2.1c2).
#
# Predicted mode (ADR-023): hpr flies its own aerodynamics, drag and normal force alike, from the
# design's geometry; the reference is RocketPy flying the example's own drag as RocketPy 1.13.0
# flies the example (RocketPy's `powerOffDragCurve.csv` and `powerOnDragCurve.csv`, which are
# identical), with RocketPy's own normal force. Everything else is the same-drag case's
# (`flight-calisto-tests-motor-at-minus-1.373.toml`): the site, the declared wind, the rail, the
# parachutes, the motor, RocketPy's gravity and atmosphere, and the same checks that hpr's design is
# the rocket the reference flew. So a difference here is the same-drag difference plus the two
# codes' aerodynamics, mostly their drag, and neither drag is the truth.
#
# Every metric carries M2.1's 3% as a target: reported as within or outside it, never gated, so a
# miss does not fail the run and a number that moves still shows in the committed report. The
# misses, and why:
#
# - apogee_drift_m (-7.00%) and landing_drift_m (+6.92%): the path in wind, where hpr turns into the
#   wind less than RocketPy (issue #50). The same-drag case misses them by -5.57% and +7.03% and
#   does not score them. Nothing else misses: the apogee is -0.53%, with hpr's C_D0 4.4% above the
#   example's curve at Mach 0.3 (`validation/fixtures/aero/rocketpy-drag-curves.json`).
id = "predicted-calisto-tests-motor-at-minus-1.373"
title = "Calisto from the pad to the ground, predicted: hpr's own aerodynamics"
reference = "validation/fixtures/flight/rocketpy-whole-flight-own-drag.json"
reference_case = "calisto-tests-motor-at-minus-1.373"

[flight.whole_flight]
design = "rocketpy-calisto-tests-motor-at-minus-1.373"
configuration = "example"
mode = "predicted"

[metrics.apogee_agl_m]
relative = 0.03

[metrics.apogee_time_s]
relative = 0.03

[metrics.max_speed_m_s]
relative = 0.03

[metrics.max_mach]
relative = 0.03

[metrics.max_acceleration_m_s2]
relative = 0.03

[metrics.max_acceleration_time_s]
relative = 0.03

[metrics.max_acceleration_power_on_m_s2]
relative = 0.03

[metrics.rail_exit_speed_m_s]
relative = 0.03

[metrics.rail_exit_time_s]
relative = 0.03

[metrics.burnout_altitude_agl_m]
relative = 0.03

[metrics.burnout_speed_m_s]
relative = 0.03

[metrics.flight_time_s]
relative = 0.03

[metrics.apogee_drift_m]
relative = 0.03

[metrics.landing_drift_m]
relative = 0.03

[metrics.impact_speed_m_s]
relative = 0.03
