# Bella Lui: RocketPy's example flown from the pad to the ground, each code with its own drag
# (`validation/oracles/rocketpy/flight.py --own-drag`, M2.1c2).
#
# Predicted mode (ADR-023): hpr flies its own drag, from the design's geometry, where the same-drag
# case flies the declared table (its normal force is its own in both modes, so only the drag
# differs); the reference is RocketPy flying the example's own drag as RocketPy 1.13.0 flies the
# example (a constant C_D 0.43, power-on and power-off, since the notebook's later replacement curve
# never reaches the flight), with RocketPy's own normal force. Everything else is the same-drag
# case's (`flight-bella-lui.toml`): the site, the declared wind, the rail, the parachutes, the
# motor, RocketPy's gravity and atmosphere, and the same checks that hpr's design is the rocket the
# reference flew. So a difference here is the same-drag difference plus the two codes' drag, and
# neither drag is the truth. hpr's is for the design as transcribed: its fin thickness and edges and
# its surface finish are placeholders where RocketPy's example records none
# (`xtask/src/designs.rs`), so a miss is not a gap for hpr to close toward the example's drag.
#
# Every metric carries M2.1's 3% as a target: reported as within or outside it, never gated, so a
# miss does not fail the run and a number that moves still shows in the committed report. The
# misses, and why:
#
# - apogee_drift_m (-14.80%) and landing_drift_m (-30.34%): the path in wind (issue #50); the
#   same-drag case misses them by -15.59% and -31.32% and does not score them. Nothing else misses:
#   hpr's coasting C_D0 at Mach 0.3 is 0.423 against the example's 0.43 (computed as `cargo xtask
#   aero` computes it, pinned by `aero::tests::the_drags_the_predicted_cases_quote_are_hpr_s`), and
#   the apogee is +1.12%, against +0.48% flown on the same drag. RocketPy's own Bella Lui acceptance
#   test (tests/acceptance/test_bella_lui_rocket.py) flies the notebook's replacement curve by
#   setting power_off_drag_7d directly; this reference flies the notebook as it runs, and the curve
#   would move RocketPy's apogee by -0.037% (measured in review), changing no verdict.
id = "predicted-bella-lui"
title = "Bella Lui from the pad to the ground, predicted: hpr's own aerodynamics"
reference = "validation/fixtures/flight/rocketpy-whole-flight-own-drag.json"
reference_case = "bella-lui"

[flight.whole_flight]
design = "rocketpy-bella-lui"
configuration = "example"
mode = "predicted"

[metrics.apogee_agl_m]
relative = 0.03

[metrics.apogee_time_s]
relative = 0.03

[metrics.max_speed_m_s]
relative = 0.03

[metrics.max_mach]
relative = 0.03

[metrics.max_acceleration_m_s2]
relative = 0.03

[metrics.max_acceleration_time_s]
relative = 0.03

[metrics.max_acceleration_power_on_m_s2]
relative = 0.03

[metrics.rail_exit_speed_m_s]
relative = 0.03

[metrics.rail_exit_time_s]
relative = 0.03

[metrics.burnout_altitude_agl_m]
relative = 0.03

[metrics.burnout_speed_m_s]
relative = 0.03

[metrics.flight_time_s]
relative = 0.03

[metrics.apogee_drift_m]
relative = 0.03

[metrics.landing_drift_m]
relative = 0.03

[metrics.impact_speed_m_s]
relative = 0.03

# The time-series RMS (M2.1d1): hpr's height and speed at the reference's 120 series times, from
# ignition until hpr lands, less RocketPy's; the reference value is 0, exact agreement. Each is held
# (a target) to 3% of the scale of its trace, the reference's apogee (539.7 m) and max speed
# (98.4 m/s), rounded down to 0.1: M2.1's 3% for a point metric, applied to a whole trace, so a
# trace passes only if it is on average no further off than its peak may be.
[metrics.series_height_rms_m]
absolute = 16.1

[metrics.series_speed_rms_m_s]
absolute = 2.9
