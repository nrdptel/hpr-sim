# juno-iii-calm: the rocket, rail, site and declared drag of `flight-juno-iii.toml`,
# flown by both codes with no wind (`validation/oracles/rocketpy/flight.py`, `CALM_AIR_BASES`;
# M2.1d2, issue #50).
#
# Everything that case's header says about the metrics, the rail and the sources of the remaining
# differences holds here. What differs: with no wind, the horizontal path comes only from the
# rail's inclination and heading, so the apogee and landing drifts are scored at the milestone's 3%
# like every other metric, except Juno III's here, which miss by 3.7% because the two codes free
# the rocket from the rail at different points (ADR-025).
# In wind the drifts are open misses (issue #50); these cases measure how much of that miss is the
# response to wind.

id = "flight-juno-iii-calm"
title = "Juno III from the pad to the ground in calm air, same-drag"
reference = "validation/fixtures/flight/rocketpy-whole-flight.json"
reference_case = "juno-iii-calm"

[flight.whole_flight]
design = "rocketpy-juno-iii"
configuration = "example"

[metrics.apogee_agl_m]
relative = 0.03

[metrics.apogee_time_s]
relative = 0.03

[metrics.max_speed_m_s]
relative = 0.03

[metrics.max_mach]
relative = 0.03

[metrics.max_acceleration_m_s2]
relative = 0.03

[metrics.max_acceleration_time_s]
relative = 0.03

[metrics.max_acceleration_power_on_m_s2]
relative = 0.03

[metrics.rail_exit_speed_m_s]
relative = 0.03

[metrics.rail_exit_time_s]
relative = 0.03

[metrics.burnout_altitude_agl_m]
relative = 0.03

[metrics.burnout_speed_m_s]
relative = 0.03

[metrics.flight_time_s]
relative = 0.03

[metrics.apogee_drift_m]
not_scored = "a model difference, measured (ADR-025): hpr keeps the rocket guided until its last rail button leaves and RocketPy frees it at its first, and Juno III leaves its 85-degree rail slowest of the cases (18.2 m/s), so the extra 1.41 m of guidance keeps its path steeper: apogee drift -3.670%, with the apogee within 0.060%. With RocketPy's rail 1.41 m longer, so both codes free the rocket at the same point (validation/oracles/rocketpy/rail_release.py), RocketPy's apogee drift is 561.0 m and hpr's 549.2 m is within -2.1%. Reported, not scored; M2.1d3 (issue #50) takes up the rail release."

[metrics.landing_drift_m]
not_scored = "a model difference, measured (ADR-025): the landing point follows the apogee's (landing drift -3.695%), and the gap is the rail release, as for apogee_drift_m. With RocketPy freeing the rocket where hpr does (a rail 1.41 m longer, validation/oracles/rocketpy/rail_release.py), RocketPy's landing drift is 641.0 m and hpr's 627.2 m is within -2.2%. Reported, not scored; M2.1d3 (issue #50) takes up the rail release."

[metrics.impact_speed_m_s]
relative = 0.03

# The time-series RMS (M2.1d1): hpr's height and speed at the reference's 120 series times, from
# ignition until hpr lands, less RocketPy's; the reference value is 0, exact agreement. Each is held
# (gated) to 3% of the scale of its trace, the reference's apogee (2623.7 m) and max speed
# (227.8 m/s), rounded down to 0.1: M2.1's 3% for a point metric, applied to a whole trace, so a
# trace passes only if it is on average no further off than its peak may be.
[metrics.series_height_rms_m]
absolute = 78.7

[metrics.series_speed_rms_m_s]
absolute = 6.8
