[package]
name = "hpr-io"
description = "Foreign formats: OpenRocket `.ork`, RockSim `.rkt`, RASAero `.CDX1`, RocketPy export, the `.orc` parts database, and ERA5 weather in netCDF classic files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure crate: no I/O, and it must build for wasm32-unknown-unknown (`cargo xtask wasm-check`).
[package.metadata.hpr]
wasm = true

[dependencies]
flate2.workspace = true
hayro-jpeg2000.workspace = true
hpr-atmos.workspace = true
hpr-design.workspace = true
hpr-motor.workspace = true
roxmltree.workspace = true
# The hpr design format's JSON Schema covers what a `.ork` design keeps (M3.3).
schemars.workspace = true
# `rc`: a variable's dimension names share one allocation per dimension.
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `time`: the export's zip dates are tested with the default that reads the clock turned on,
# as a program depending on hpr-io could turn it on.
zip = { workspace = true, features = ["time"] }
