[package]
name = "hpr-format"
description = "The hpr open design format: types, JSON Schema, versioning and migrations, and the container."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure crate: no I/O, and it must build for wasm32-unknown-unknown (`cargo xtask wasm-check`).
[package.metadata.hpr]
wasm = true

[dependencies]
hpr-design.workspace = true
# The document holds a design as `hpr_io::ork` reads it (ADR-111).
hpr-io.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
hpr-core.workspace = true
hpr-motor.workspace = true
hpr-sim.workspace = true
jsonschema.workspace = true
