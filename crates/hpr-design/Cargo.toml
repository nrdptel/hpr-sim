[package]
name = "hpr-design"
description = "The canonical rocket design model: component tree, shapes, materials, mass properties, stages and configurations, and design checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure crate: no I/O, and it must build for wasm32-unknown-unknown (`cargo xtask wasm-check`).
[package.metadata.hpr]
wasm = true

[dependencies]
hpr-core.workspace = true
hpr-motor.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
glam.workspace = true
proptest.workspace = true
serde_json.workspace = true

[[bench]]
name = "mass"
harness = false

[[bench]]
name = "design"
harness = false
