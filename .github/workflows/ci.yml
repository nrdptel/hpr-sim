name: CI

# Runs on every pull request, with no path filters, so docs-only PRs also get checks to merge on.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Warnings that only appear on macOS or Windows fail too (clippy covers Linux).
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      # Runs every example program, such as the Getting started page's first flight, and checks
      # that it prints what its committed `<name>.output.txt` says, on each OS.
      - run: cargo run --locked --quiet --package xtask -- examples --check --locked

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  wasm-check:
    name: wasm-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # `cargo xtask` without its alias, so the xtask build itself is --locked too.
      - run: cargo run --locked --quiet --package xtask -- wasm-check --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          # deny.toml is written for this version; bump both together.
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # book.toml is written for this version (ADR-016); bump both together.
          tool: mdbook@0.5.4
      # Checks the pages' links and labels, builds the site with mdBook into target/site, and
      # checks every link in the built HTML.
      - run: cargo run --locked --quiet --package xtask -- site
